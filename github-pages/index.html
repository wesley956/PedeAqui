<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1f1f1f" />
  <title>PedeAqui</title>
  <style>
    :root{color-scheme:dark;--bg:#171717;--card:#222;--line:#333;--text:#f7f7f7;--muted:#b8b8b8;--orange:#ff7a00}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#30251d 0,#1b1b1b 38%,#121212 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);padding:24px}
    main{width:min(720px,100%);background:rgba(34,34,34,.94);border:1px solid var(--line);border-radius:24px;padding:clamp(28px,6vw,56px);box-shadow:0 28px 70px rgba(0,0,0,.35);text-align:center}
    img{display:block;width:min(330px,80%);height:auto;margin:0 auto 28px}
    h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px;letter-spacing:-.04em}p{margin:0 auto 30px;color:var(--muted);font-size:17px;line-height:1.6;max-width:520px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:14px;background:var(--orange);color:#171717;text-decoration:none;font-weight:800;transition:.18s ease}a:hover{transform:translateY(-1px);filter:brightness(1.06)}a:focus-visible{outline:3px solid #fff;outline-offset:4px}
    small{display:block;margin-top:26px;color:#858585}
  </style>
</head>
<body>
  <main>
    <img src="./brand/pedeaqui-logo-on-dark.svg" alt="PedeAqui" />
    <h1>Seu pedido começa aqui.</h1>
    <p>Entrada pública do PedeAqui. O sistema principal utiliza uma aplicação Next.js dinâmica conectada ao Supabase para autenticação, cardápio, pedidos e operação do restaurante.</p>
    <a href="https://pedeaqui-cruzjade080-4490s-projects.vercel.app/" rel="noopener">Abrir PedeAqui</a>
    <small>GitHub Pages · PedeAqui</small>
  </main>
</body>
</html>
