name: CI shots (debug)

on:
  push:
    branches: ["ci-debug/**"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://idyjinpeijyqcejnunwm.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RPOdbBk09PVZioKrDPX_rw_7Y3dl7Ou
      SUPABASE_SERVICE_ROLE_KEY: browser_server_only_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm install --no-save --legacy-peer-deps --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Typecheck and lint
        run: |
          set +e
          npx tsc --noEmit > ci-shots/typecheck.txt 2>&1; echo "tsc exit $?" >> ci-shots/typecheck.txt
          npx eslint src > ci-shots/lint.txt 2>&1; echo "eslint exit $?" >> ci-shots/lint.txt
          npx vitest run > ci-shots/vitest.txt 2>&1; echo "vitest exit $?" >> ci-shots/vitest.txt
          true
      - run: npx vitest run --config ci-shots/vitest.shots.config.ts > ci-shots/render.txt 2>&1 || true
      - run: npm run build > ci-shots/build.txt 2>&1 || (tail -80 ci-shots/build.txt; true)
      - run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null "$BASE_URL/m/santa-rita" && break; sleep 3; done
      - run: node ci-shots/shots.mjs > ci-shots/shots.txt 2>&1 || true
      - name: Publish screenshots to the branch
        run: |
          tail -n 100 /tmp/app.log > ci-shots/app.log || true
          git config user.name "ci-shots"
          git config user.email "ci-shots@users.noreply.github.com"
          git add -f ci-shots/png ci-shots/out ci-shots/*.txt ci-shots/app.log || true
          git commit -m "ci-shots: screenshots [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME}
