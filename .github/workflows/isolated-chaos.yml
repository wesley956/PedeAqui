name: Isolated Chaos

on:
  # workflow_dispatch is the release-gate path for changes outside supabase/**.
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/run-isolated-chaos.sh"
      - "scripts/run-tenant-http-isolation.py"
      - "scripts/run-tenant-next-isolation.py"
      - "scripts/tenant-ssr-session.mjs"
      - "scripts/tenant-server-action.mjs"
      - ".github/workflows/isolated-chaos.yml"

permissions:
  contents: read

jobs:
  disposable-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Setup Node for real authenticated Next HTTP proof
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Run repeatable isolated chaos matrix
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run-isolated-chaos.sh | tee isolated-chaos.log

      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-chaos-evidence
          path: isolated-chaos.log
          if-no-files-found: error
          retention-days: 30
