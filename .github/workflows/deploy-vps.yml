name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pedeaqui-production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-vps
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 2

      - name: Skip deployment for documentation and test-only commits
        id: change_gate
        shell: bash
        run: |
          set -euo pipefail
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          # Fail open for unknown history: preserve deployment on all ambiguous changes.
          if ! git rev-parse "${DEPLOY_SHA}^" >/dev/null 2>&1; then
            echo "No parent commit available; preserving deployment."
            exit 0
          fi
          mapfile -d '' files < <(git diff --name-only -z "${DEPLOY_SHA}^" "$DEPLOY_SHA")
          if (( ${#files[@]} == 0 )); then
            echo "No changed files; preserving deployment."
            exit 0
          fi
          for file in "${files[@]}"; do
            case "$file" in
              tests/*|docs/*|.github/*|README.md|CONTRIBUTING.md) ;;
              *) echo "Runtime-affecting or unknown change: $file"; exit 0 ;;
            esac
          done
          echo "Only tests, docs or GitHub automation changed; skipping VPS deployment."
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"

      - name: Build production image
        if: steps.change_gate.outputs.should_deploy == 'true'
        run: docker build -f Dockerfile.production -t "pedeaqui-production:$DEPLOY_SHA" .

      - name: Skip superseded commits
        if: steps.change_gate.outputs.should_deploy == 'true'
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$DEPLOY_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit exists on main; this version will not deploy.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH credentials
        if: steps.change_gate.outputs.should_deploy == 'true' && steps.freshness.outputs.current == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$VPS_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pedeaqui
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pedeaqui ~/.ssh/known_hosts

      - name: Transfer and deploy image
        if: steps.change_gate.outputs.should_deploy == 'true' && steps.freshness.outputs.current == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          docker save "pedeaqui-production:$DEPLOY_SHA" | gzip -1 > "$RUNNER_TEMP/$DEPLOY_SHA.tar.gz"
          scp -i ~/.ssh/pedeaqui -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/$DEPLOY_SHA.tar.gz" "root@$VPS_HOST:/opt/pedeaqui/incoming/$DEPLOY_SHA.tar.gz"
          ssh -i ~/.ssh/pedeaqui -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$VPS_HOST" "/opt/pedeaqui/bin/deploy-vps.sh $DEPLOY_SHA"

      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/pedeaqui ~/.ssh/known_hosts
