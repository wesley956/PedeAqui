name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_server_only_placeholder
      APP_URL: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check database migration history
        run: npm run db:drift

      - name: Compare production migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "DB_DRIFT: comparação remota ignorada; secret SUPABASE_DB_URL não configurado."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          remote_file="$(mktemp)"
          trap 'rm -f "$remote_file"' EXIT
          psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -c "select version || '|' || name from supabase_migrations.schema_migrations order by version" \
            > "$remote_file"
          node scripts/check-db-drift.mjs --remote-file "$remote_file"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: E2E context journeys
        run: npm run test:e2e

      - name: Validate Print Agent
        run: |
          node --check print-agent/src/index.mjs
          node --check print-agent/src/spool.mjs
          node --check print-agent/src/escpos.mjs

      - name: Build
        run: npm run build
