name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_server_only_placeholder
      APP_URL: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository technical name
        run: node scripts/check-repository-name.mjs

      # npm 10.9.8/Arborist currently crashes resolving this graph's peer set
      # before project validation can begin. Keep the workaround scoped to install;
      # lint, typecheck, tests, E2E and build remain the authoritative gates below.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Check database migration history
        run: npm run db:drift

      - name: Compare production migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "DB_DRIFT: comparação remota ignorada; secret SUPABASE_DB_URL não configurado."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          remote_file="$(mktemp)"
          trap 'rm -f "$remote_file"' EXIT
          psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -c "select version || '|' || name from supabase_migrations.schema_migrations order by version" \
            > "$remote_file"
          node scripts/check-db-drift.mjs --remote-file "$remote_file"

      - name: Production infrastructure preflight
        env:
          PREFLIGHT_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          PREFLIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run preflight:production

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Public UX final homologation contracts
        run: npm run test:public-ux

      - name: E2E context journeys — 3 consecutive passes
        run: |
          for attempt in 1 2 3; do
            echo "PUBLIC_UX_JOURNEY_PASS=${attempt}/3"
            npm run test:e2e
          done

      - name: Validate Print Agent
        run: |
          node --check print-agent/src/index.mjs
          node --check print-agent/src/spool.mjs
          node --check print-agent/src/escpos.mjs
          node --check print-agent/src/system-print.mjs

      - name: Build
        run: npm run build
