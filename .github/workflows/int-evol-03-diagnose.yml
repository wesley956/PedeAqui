name: INT-EVOL-03 Diagnose

on:
  push:
    branches:
      - int-evol-03-natural-conversation-shadow-semantic

permissions:
  contents: read

jobs:
  vitest-shard:
    name: Diagnose shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_server_only_placeholder
      APP_URL: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run shard ${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.ts' | sort | grep -v -E 'whatsapp-(natural-navigation|int-evol-03-catalog-payment|active-order-side-intent)\.test\.ts$')
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == ${{ matrix.shard }} )); then selected+=("${files[$i]}"); fi
          done
          printf 'SHARD%s %s\n' '${{ matrix.shard }}' "${selected[@]}"
          npx vitest run "${selected[@]}"
