name: INT-EVOL-03 Diagnose

on:
  push:
    branches:
      - int-evol-03-natural-conversation-shadow-semantic

permissions:
  contents: read

jobs:
  vitest-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_server_only_placeholder
      APP_URL: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Diagnose — existing shard 0
        id: shard0
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.ts' | sort | grep -v -E 'whatsapp-(natural-navigation|int-evol-03-catalog-payment|active-order-side-intent)\.test\.ts$')
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == 0 )); then selected+=("${files[$i]}"); fi
          done
          printf 'SHARD0 %s\n' "${selected[@]}"
          npx vitest run "${selected[@]}"

      - name: Diagnose — existing shard 1
        id: shard1
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.ts' | sort | grep -v -E 'whatsapp-(natural-navigation|int-evol-03-catalog-payment|active-order-side-intent)\.test\.ts$')
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == 1 )); then selected+=("${files[$i]}"); fi
          done
          printf 'SHARD1 %s\n' "${selected[@]}"
          npx vitest run "${selected[@]}"

      - name: Diagnose — existing shard 2
        id: shard2
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.ts' | sort | grep -v -E 'whatsapp-(natural-navigation|int-evol-03-catalog-payment|active-order-side-intent)\.test\.ts$')
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == 2 )); then selected+=("${files[$i]}"); fi
          done
          printf 'SHARD2 %s\n' "${selected[@]}"
          npx vitest run "${selected[@]}"

      - name: Diagnose — existing shard 3
        id: shard3
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.ts' | sort | grep -v -E 'whatsapp-(natural-navigation|int-evol-03-catalog-payment|active-order-side-intent)\.test\.ts$')
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == 3 )); then selected+=("${files[$i]}"); fi
          done
          printf 'SHARD3 %s\n' "${selected[@]}"
          npx vitest run "${selected[@]}"

      - name: Fail if any shard failed
        if: always()
        run: |
          echo "shard0=${{ steps.shard0.outcome }}"
          echo "shard1=${{ steps.shard1.outcome }}"
          echo "shard2=${{ steps.shard2.outcome }}"
          echo "shard3=${{ steps.shard3.outcome }}"
          test "${{ steps.shard0.outcome }}" = success
          test "${{ steps.shard1.outcome }}" = success
          test "${{ steps.shard2.outcome }}" = success
          test "${{ steps.shard3.outcome }}" = success
