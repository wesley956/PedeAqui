name: PDV Events Homologation
on:
  pull_request:
    paths:
      - 'src/features/pdv/**'
      - 'src/server/pdv/**'
      - 'src/server/menu/**'
      - 'src/server/conversations/greeting-service.ts'
      - 'src/server/conversations/automation-hours-service.ts'
      - 'supabase/migrations/*pdv_events.sql'
      - 'scripts/*pdv-events*'
      - '.github/workflows/pdv-events-homologation.yml'
permissions:
  contents: read
jobs:
  isolated-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm install --no-save --legacy-peer-deps --no-audit --no-fund playwright@1.55.0 pg@8.23.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 postgresql-contrib-16
      - name: Prove stock and payments with disposable PostgreSQL
        env:
          PDV_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: node scripts/test-pdv-events-postgres.mjs
      - name: Prove event UI, retry, stock limit and cart preservation
        run: node scripts/browser-pdv-events.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdv-1355-isolated
          path: artifacts/pdv-1355
          if-no-files-found: error
