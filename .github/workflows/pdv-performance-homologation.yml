name: PDV Performance Homologation
on:
  pull_request:
    paths:
      - 'src/features/conversations/human-attention-alert.tsx'
      - 'src/server/conversations/human-attention-alert-service.ts'
      - 'src/app/api/conversations/human-attention/**'
      - 'scripts/browser-pdv-performance.mjs'
      - '.github/workflows/pdv-performance-homologation.yml'
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm install --no-save --legacy-peer-deps --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-pdv-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdv-1356-browser
          path: artifacts/pdv-1356
          if-no-files-found: error
