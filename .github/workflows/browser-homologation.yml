name: Browser Homologation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/browser-homologation.yml"

permissions:
  contents: read

jobs:
  public-browser-homologation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.pedeaqui.pp.ua
      DEMO_SLUG: santa-rita
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser homologation tools
        run: npm install --no-save --legacy-peer-deps playwright@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run public browser homologation
        run: node scripts/browser-homologation.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-homologation-evidence
          path: artifacts/browser-homologation
          if-no-files-found: error
          retention-days: 30
