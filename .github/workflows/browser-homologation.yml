name: Browser Homologation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/browser-homologation.mjs"
      - "scripts/browser-order-print-reliability.mjs"
      - "scripts/browser-event-store-closure.mjs"
      - "scripts/prepare-browser-supabase.sh"
      - "supabase/sql/**"
      - "supabase/tests/browser_public_fixture.sql"
      - ".github/workflows/browser-homologation.yml"

permissions:
  contents: read

jobs:
  public-browser-homologation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      DEMO_SLUG: browser-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup disposable Supabase
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Prepare isolated database and public fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          bash scripts/prepare-browser-supabase.sh

      - name: Install project dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser homologation tools
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund playwright@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Build exact PR for production
        run: npm run build

      - name: Verify isolated checkout and printing recovery UI
        run: node scripts/browser-order-print-reliability.mjs

      - name: Start exact production build locally
        shell: bash
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/pedeaqui-browser-app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Run FLOW-10 controlled resilience batch
        shell: bash
        run: |
          mkdir -p artifacts/browser-homologation
          set -o pipefail
          npx vitest run \
            tests/flow-10-public-entry-cart.test.ts \
            tests/flow-10-checkout-network-resilience.test.ts \
            tests/flow-10-notification-safety-batch.test.ts \
            tests/flow-10-final-public-lifecycle.test.ts \
            tests/flow-10-final-lifecycle-notification.test.ts \
            --reporter=verbose | tee artifacts/browser-homologation/flow10-batch7.log

      - name: Wait for local PedeAqui
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            login_status="$(curl -sS -o /tmp/pedeaqui-login.html -w '%{http_code}' --max-time 10 "${BASE_URL}/login" || true)"
            menu_status="$(curl -sS -o /tmp/pedeaqui-menu.html -w '%{http_code}' --max-time 15 "${BASE_URL}/m/${DEMO_SLUG}" || true)"
            if [ "$login_status" = "200" ] && [ "$menu_status" = "200" ]; then
              echo "Local PedeAqui production build ready (login=${login_status}, menu=${menu_status})."
              exit 0
            fi
            echo "Local app not ready yet (attempt ${attempt}/60, login=${login_status:-000}, menu=${menu_status:-000})."
            tail -n 20 /tmp/pedeaqui-browser-app.log || true
            sleep 3
          done
          echo "Local PedeAqui did not become ready." >&2
          cat /tmp/pedeaqui-browser-app.log >&2 || true
          exit 1

      - name: Run public browser homologation
        run: node scripts/browser-homologation.mjs

      - name: Verify event closure and reopening on real public pages
        run: node scripts/browser-event-store-closure.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-homologation-evidence
          path: artifacts/browser-homologation
          if-no-files-found: warn
          retention-days: 30

      - name: Show local app log on failure
        if: failure()
        run: tail -n 200 /tmp/pedeaqui-browser-app.log || true

      - name: Stop local PedeAqui
        if: always()
        shell: bash
        run: |
          if [ -n "${APP_PID:-}" ]; then
            kill "$APP_PID" 2>/dev/null || true
          fi

      - name: Destroy disposable Supabase
        if: always()
        run: supabase stop --no-backup --workdir "$RUNNER_TEMP/pedeaqui-browser-supabase"
