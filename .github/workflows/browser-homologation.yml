name: Browser Homologation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/browser-homologation.mjs"
      - ".github/workflows/browser-homologation.yml"

permissions:
  contents: read

jobs:
  public-browser-homologation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEMO_SLUG: santa-rita
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Vercel preview URL
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          slug="$(printf '%s' "$branch" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          base_url="https://cruz-git-${slug}-pede-aqui.vercel.app"
          echo "BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "Browser homologation target: ${base_url}"

      - name: Wait for Vercel preview
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 10 "${BASE_URL}/login" || true)"
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "Preview ready with HTTP ${status}."
              exit 0
            fi
            echo "Preview not ready yet (attempt ${attempt}/36, HTTP ${status:-000})."
            sleep 5
          done
          echo "Vercel preview did not become reachable in the allotted window." >&2
          exit 1

      - name: Install project dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser homologation tools
        run: npm install --no-save --legacy-peer-deps playwright@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run public browser homologation
        run: node scripts/browser-homologation.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-homologation-evidence
          path: artifacts/browser-homologation
          if-no-files-found: warn
          retention-days: 30
