name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          mkdir -p pages/brand
          cp public/brand/pedeaqui-logo-on-dark.svg pages/brand/
          cp public/brand/pedeaqui-logo.svg pages/brand/
          cp public/brand/pedeaqui-symbol.svg pages/brand/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
