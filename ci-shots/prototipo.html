<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo cardápio e checkout</title>
<style>
:root{
  --brand:#C8102E; --on-brand:#fff;
  --brand-soft:color-mix(in srgb,var(--brand) 10%,#fff);
  --brand-line:color-mix(in srgb,var(--brand) 35%,#e6e6ea);
  --bg:#f4f4f6; --surface:#fff; --surface-2:#f6f6f8; --line:#e6e6ea;
  --text:#18181b; --muted:#62626b; --ok:#13795b; --ok-soft:#e7f6ef; --warn:#a15c00; --warn-soft:#fff4e0; --err:#b42318; --err-soft:#fdecea;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --pill:999px;
  --shadow:0 1px 2px rgb(0 0 0/.06),0 4px 14px rgb(0 0 0/.06);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* ---------- moldura do protótipo ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#111114;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em}
.topbar h1 small{display:block;font-weight:500;color:#b4b4bc;font-size:12px}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vtabs button{border:1px solid #3a3a42;background:#1d1d22;color:#e8e8ec;border-radius:var(--pill);padding:7px 12px;font-size:13px;font-weight:600}
.vtabs button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:auto}
.swatches{display:flex;gap:6px;align-items:center;font-size:12px;color:#b4b4bc}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid #111114;outline:2px solid transparent;padding:0}
.swatches button[aria-pressed=true]{outline-color:#fff}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#d4d4da;background:#1d1d22;border:1px solid #3a3a42;border-radius:var(--pill);padding:5px 10px}
.toggle b{color:#fff}
.reset{border:1px solid #3a3a42;background:transparent;color:#d4d4da;border-radius:var(--pill);padding:6px 10px;font-size:12px}
.stage{display:grid;grid-template-columns:minmax(260px,360px) auto;gap:32px;justify-content:center;align-items:start;padding:24px 16px 40px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;font-size:14px;line-height:1.5;position:sticky;top:84px}
.notes h2{font-size:18px;margin:0 0 4px}
.notes .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:var(--pill);padding:2px 9px;margin-bottom:8px}
.notes h3{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:none;letter-spacing:0}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:3px 0}
.notes .try{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;font-size:13px}
.phone{width:390px;height:820px;border-radius:44px;background:#0d0d10;padding:12px;box-shadow:0 30px 60px rgb(0 0 0/.25)}
#app{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--surface)}
@media (max-width:780px){
  .stage{grid-template-columns:1fr;padding:0;gap:0}
  .notes{position:static;border-radius:0;border-width:0 0 1px;order:2}
  .notes.collapsed .notes-body{display:none}
  .phone{width:100%;height:calc(100dvh - var(--topbar-h,120px));border-radius:0;padding:0;box-shadow:none;order:1}
  #app{border-radius:0}
  .tools{margin-left:0}
}
.notes-toggle{display:none;border:0;background:none;color:var(--brand);font-weight:600;padding:0;margin-top:6px}
@media (max-width:780px){.notes-toggle{display:inline-block}}
/* ---------- app ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;font-size:15px}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding-bottom:110px}
.scroll::-webkit-scrollbar{width:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{border:0;border-radius:var(--r-md);min-height:48px;padding:0 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--pill);font-size:12px;font-weight:600;padding:3px 9px}
.badge-open{background:var(--ok-soft);color:var(--ok)}
.badge-closed{background:var(--warn-soft);color:var(--warn)}
.badge-offer{background:var(--brand-soft);color:var(--brand)}
.badge-out{background:#eeeef1;color:var(--muted)}
.price{font-weight:700}
.old{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:500}
.from{font-size:13px;color:var(--muted);font-weight:500}
.tile{display:grid;place-items:center;border-radius:var(--r-md);flex:none;overflow:hidden}
.tile svg{width:46%;height:46%}
.backbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.backbar h2{font-size:17px;margin:0;flex:1}
.iconbtn{border:0;background:var(--surface-2);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
/* barra do carrinho */
.cartbar{position:absolute;left:12px;right:12px;bottom:14px;z-index:6;display:flex;align-items:center;gap:12px;background:var(--brand);color:var(--on-brand);border:0;border-radius:var(--r-lg);padding:12px 16px;min-height:56px;box-shadow:0 10px 24px color-mix(in srgb,var(--brand) 35%,transparent);font-weight:700;text-align:left}
.cartbar .count{background:color-mix(in srgb,var(--on-brand) 22%,transparent);border-radius:var(--pill);min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.cartbar .lbl{flex:1}
.cartbar small{display:block;font-weight:500;opacity:.85;font-size:12px}
/* loja */
.cover{height:150px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 40%,#111));position:relative;overflow:hidden}
.cover svg{position:absolute;right:-30px;bottom:-40px;width:220px;height:220px;opacity:.18;color:#fff}
.logo{width:64px;height:64px;border-radius:18px;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--brand);box-shadow:var(--shadow);border:3px solid var(--surface);flex:none}
.storecard{margin:-36px 14px 0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.storecard h1{font-size:19px;margin:0 0 4px}
.facts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.facts b{color:var(--text);font-weight:600}
.closedbanner{margin:12px 14px 0;background:var(--warn-soft);color:#6b3d00;border-radius:var(--r-md);padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.search{margin:14px 14px 0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;min-height:46px}
.search input{border:0;background:transparent;outline:0;flex:1;min-height:44px;font-size:15px}
.search svg{width:18px;height:18px;color:var(--muted)}
.cats{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(10px);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;margin-top:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.section{padding:6px 14px 4px;scroll-margin-top:64px}
.section>h2{font-size:18px;margin:14px 0 8px}
.empty{padding:30px 14px;text-align:center;color:var(--muted)}
/* Proposta A: lista clássica */
.vA .cats{gap:18px;padding:0 14px}
.vA .cats .chip{border:0;border-radius:0;background:none;padding:14px 0 11px;border-bottom:3px solid transparent;color:var(--muted)}
.vA .cats .chip[aria-pressed=true]{color:var(--text);border-bottom-color:var(--brand);background:none}
.row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;align-items:flex-start}
.row:last-child{border-bottom:0}
.row .info{flex:1;min-width:0}
.row h3{font-size:15px;margin:0 0 4px;font-weight:650}
.row p{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.out{opacity:.55}
.vA .row .tile{width:92px;height:92px}
/* Proposta B: vitrine */
.vB .cover{height:220px}
.vB .storecard{margin:-52px 14px 0;flex-direction:column;align-items:flex-start;text-align:left}
.vB .storecard .logo{margin-top:-46px;width:72px;height:72px}
.vB .cats .chip{display:flex;align-items:center;gap:6px}
.vB .cats .chip svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);text-align:left;padding:0;display:flex;flex-direction:column;position:relative}
.card .tile{width:100%;aspect-ratio:4/3;border-radius:0}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:14px;margin:0;font-weight:650;line-height:1.3}
.card .badge{position:absolute;top:8px;left:8px}
.card.out{opacity:.55}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.rail::-webkit-scrollbar{display:none}
.rail .card{width:240px;flex:none;flex-direction:row;align-items:center}
.rail .card .tile{width:88px;aspect-ratio:1;flex:none}
/* Proposta C: expresso */
.vC .header-c{padding:16px 14px 6px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.vC .header-c .logo{width:48px;height:48px;border-radius:14px;font-size:17px;box-shadow:none;border:1px solid var(--line)}
.vC .header-c h1{font-size:17px;margin:0}
.again{margin:12px 14px 0;border:1px solid var(--brand-line);background:var(--brand-soft);border-radius:var(--r-lg);padding:12px;display:flex;gap:12px;align-items:center}
.again .info{flex:1;font-size:13px}
.again b{display:block;font-size:14px}
.vC .row{padding:10px 0;align-items:center}
.vC .row .tile{width:56px;height:56px}
.vC .row p{-webkit-line-clamp:1;margin-bottom:2px}
.vC .row h3{margin-bottom:2px}
.plus{width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.plus svg{width:20px;height:20px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--pill);background:var(--surface);flex:none}
.stepper button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center;color:var(--brand)}
.stepper button svg{width:18px;height:18px}
.stepper output{min-width:22px;text-align:center;font-weight:700}
/* folha do produto */
.overlay{position:absolute;inset:0;background:rgb(0 0 0/.42);z-index:30;display:flex;align-items:flex-end}
.overlay.anim{animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.anim .sheet{animation:up .22s ease}
.vB .overlay{background:var(--surface);align-items:stretch}
.vB .sheet{max-height:none;height:100%;border-radius:0}
.vB .anim .sheet{animation:fade .15s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.sheet-body{overflow-y:auto;flex:1;scroll-behavior:smooth}
.sheet-hero{position:relative}
.sheet-hero .tile{width:100%;height:190px;border-radius:0}
.vB .sheet-hero .tile{height:300px}
.sheet-hero .iconbtn{position:absolute;top:12px;right:12px;background:rgb(255 255 255/.92)}
.vB .sheet-hero .iconbtn{left:12px;right:auto}
.sheet-head{padding:14px 16px 6px}
.sheet-head h2{margin:0 0 6px;font-size:21px}
.sheet-head p{margin:0 0 8px;color:var(--muted);font-size:14px;line-height:1.45}
.group{border-top:8px solid var(--surface-2);padding:14px 16px}
.group-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.group-h h3{margin:0;font-size:16px}
.group-h .rule{font-size:13px;color:var(--muted);margin-top:2px}
.req{font-size:12px;font-weight:700;border-radius:var(--pill);padding:3px 9px;background:#18181b;color:#fff;white-space:nowrap}
.req.ok{background:var(--ok-soft);color:var(--ok)}
.req.opt{background:var(--surface-2);color:var(--muted)}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 0;text-align:left;font-size:15px}
.opt-row:last-child{border-bottom:0}
.opt-row .nm{flex:1}
.opt-row .pr{color:var(--muted);font-size:14px}
.mark{width:22px;height:22px;border:2px solid #b9b9c2;border-radius:50%;flex:none;display:grid;place-items:center}
.mark.sq{border-radius:6px}
.opt-row[aria-checked=true] .mark{border-color:var(--brand);background:var(--brand)}
.opt-row[aria-checked=true] .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-brand)}
.opt-row[aria-checked=true] .mark.sq::after{width:10px;height:6px;border-radius:0;background:none;border-left:2.5px solid var(--on-brand);border-bottom:2.5px solid var(--on-brand);transform:rotate(-45deg) translate(1px,-1px)}
.opt-row[disabled]{opacity:.4}
.group.missing .req{background:var(--err);color:#fff}
.group.missing{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;min-height:76px;resize:vertical;font-size:15px}
.sheet-foot{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;background:var(--surface)}
.sheet-foot .btn{flex:1;justify-content:space-between}
.missing-msg{color:var(--err);font-size:13px;padding:0 16px 8px;font-weight:600}
/* carrinho e checkout */
.page{padding:6px 14px 20px}
.line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.line .tile{width:56px;height:56px}
.line .info{flex:1;min-width:0}
.line h3{margin:0 0 3px;font-size:15px}
.line .opts{font-size:13px;color:var(--muted);line-height:1.4}
.line .acts{display:flex;align-items:center;gap:12px;margin-top:8px}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:4px 0;font-size:14px}
.progress{background:var(--surface-2);border-radius:var(--r-md);padding:12px;margin:14px 0;font-size:14px}
.bar{height:8px;border-radius:var(--pill);background:#e3e3e8;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--brand);border-radius:var(--pill);transition:width .25s}
.progress.done{background:var(--ok-soft);color:var(--ok)}
.progress.done .bar span{background:var(--ok)}
.upsell h3{font-size:16px;margin:18px 0 8px}
.upsell .rail .card{width:200px}
.totals{margin-top:14px;display:grid;gap:8px;font-size:15px}
.totals div{display:flex;justify-content:space-between}
.totals .total{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:10px}
.totals .disc{color:var(--ok)}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.foot .btn{justify-content:space-between}
.foot .hint{font-size:13px;color:var(--err);margin:0 0 8px;font-weight:600}
.block{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-top:12px;background:var(--surface)}
.block>h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.block.err{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.errtxt{color:var(--err);font-size:13px;margin-top:6px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;text-align:left;min-height:62px}
.seg button b{display:block;font-size:15px}
.seg button span{font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
.field{display:grid;gap:5px;margin-top:10px}
.field label{font-size:13px;font-weight:600}
.field input{border:1px solid #d4d4da;border-radius:var(--r-md);min-height:48px;padding:0 12px;font-size:16px;background:var(--surface);width:100%}
.field input:focus{outline:3px solid color-mix(in srgb,var(--brand) 25%,transparent);border-color:var(--brand)}
.field .help{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 110px;gap:10px}
.ok-box{background:var(--ok-soft);color:var(--ok);border-radius:var(--r-md);padding:10px 12px;font-size:14px;margin-top:10px}
.err-box{background:var(--err-soft);color:var(--err);border-radius:var(--r-md);padding:10px 12px;font-size:14px;margin-top:10px}
.info-box{background:var(--brand-soft);border-radius:var(--r-md);padding:10px 12px;font-size:14px;margin-top:10px}
.paygroup{margin-top:4px}
.paygroup h4{font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.payopt{display:flex;gap:12px;align-items:center;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px;margin-bottom:8px;text-align:left}
.payopt .nm{flex:1}
.payopt .nm b{display:block;font-size:15px}
.payopt .nm span{font-size:13px;color:var(--muted)}
.payopt[aria-checked=true]{border-color:var(--brand);background:var(--brand-soft)}
.payopt[aria-checked=true] .mark{border-color:var(--brand);background:var(--brand)}
.payopt[aria-checked=true] .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-brand)}
.payicon{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.payicon svg{width:20px;height:20px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.mini span:first-child{color:var(--muted)}
/* B: acordeão */
.step{border:1px solid var(--line);border-radius:var(--r-lg);margin-top:10px;overflow:hidden}
.step-h{width:100%;display:flex;gap:12px;align-items:center;border:0;background:var(--surface);padding:14px;text-align:left}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.step.done .step-n{background:var(--ok);color:#fff}
.step.cur .step-n{background:var(--brand);color:var(--on-brand)}
.step-h .t{flex:1}
.step-h .t b{display:block}
.step-h .t span{font-size:13px;color:var(--muted)}
.step-b{padding:0 14px 14px}
.step.err{border-color:var(--err)}
/* C: compacto */
.vC .block{padding:12px}
.vC .block>h3{font-size:15px;margin-bottom:6px}
.vC .field{margin-top:8px}
/* acompanhamento */
.track-head{padding:22px 16px 10px;text-align:center}
.track-head .num{font-size:13px;color:var(--muted)}
.track-head h2{margin:6px 0 4px;font-size:22px}
.timeline{list-style:none;margin:10px 16px;padding:0}
.timeline li{display:flex;gap:12px;position:relative;padding:0 0 18px}
.timeline li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:24px;height:24px;border-radius:50%;border:2px solid #c9c9d0;background:var(--surface);flex:none;display:grid;place-items:center;z-index:1}
.timeline li.done .dot{background:var(--ok);border-color:var(--ok)}
.timeline li.done .dot::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.timeline li.now .dot{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.timeline li.now .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.timeline b{display:block;font-size:15px}
.timeline span{font-size:13px;color:var(--muted)}
.pixbox{margin:12px 16px;border:1px solid var(--brand-line);border-radius:var(--r-lg);padding:16px;text-align:center}
.pixbox svg.qr{width:180px;height:180px;margin:10px auto;display:block}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface-2);border-radius:var(--r-sm);padding:8px;word-break:break-all;text-align:left;margin:8px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.toast{position:absolute;left:14px;right:14px;bottom:84px;z-index:40;background:#18181b;color:#fff;border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px}
.toast.anim{animation:up .2s ease}
.toast span{flex:1}
.toast button{border:0;background:none;color:#ffd166;font-weight:700}
</style>

/* ================= acompanhamento ================= */
const STAGES = [["Pedido recebido", "A loja já viu seu pedido"], ["Em preparo", "Sua comida está sendo feita"], ["Saiu para entrega", "O entregador está a caminho"], ["Entregue", "Bom apetite!"]];

function timerText() { if (!S.order) return ""; const ms = Math.max(0, S.order.expires - Date.now()); const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000); return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }

/* ================= toast ================= */
